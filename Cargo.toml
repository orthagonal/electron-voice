[package]
name = "electron-voice"
version = "0.1.0"
license = "ISC"
edition = "2021"
rust-version = "1.88"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cpal = "0.15.3"
neon = "1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12.1"

