name: Build Vosk macOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          brew install cmake swig
          python3 -m pip install numpy

      - name: Clone vosk-api (if not in repo)
        run: |
          git clone --depth=1 https://github.com/alphacep/vosk-api.git vosk

      - name: Build libvosk.dylib
        run: |
          mkdir -p vosk/build
          cd vosk/build
          cmake ..
          make -j$(sysctl -n hw.ncpu)

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v3
        with:
          name: libvosk-macos
          path: |
            vosk/build/src/libvosk.dylib
            vosk/src/vosk_api.h
