name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            node: '22'
          - os: windows-latest
            node: '24'
          - os: ubuntu-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # The runner uses Node built-ins and Cargo; no npm dependencies are needed.
      - name: Run tests without a microphone or model
        run: npm test

  macos-check:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      # Native CI uses Apple's tools; retain the existing custom cross-linker
      # configuration for users cross-compiling outside these runners.
      CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: clang
      CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: clang
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Does not claim to link/run against both architectures of bundled Vosk.
      - run: cargo check --locked --all-targets --target ${{ matrix.target }}
