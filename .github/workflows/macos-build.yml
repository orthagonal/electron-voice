name: Build electron-voice for macOS

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build library
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Create release directory
      run: mkdir -p Releases

    - name: Copy built library
      run: |
        cp target/${{ matrix.target }}/release/libelectron_voice.dylib ./Releases/libelectron_voice-${{ matrix.target }}.dylib

    - name: Create Universal Binary
      if: success() && matrix.target == 'aarch64-apple-darwin'
      run: |
        lipo -create -output ./Releases/libelectron_voice-universal.dylib \
          ./Releases/libelectron_voice-x86_64-apple-darwin.dylib \
          ./Releases/libelectron_voice-aarch64-apple-darwin.dylib

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |

          Releases/libelectron_voice-universal.dylib
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 