name: Build Vosk macOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake swig automake sox libtool
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install numpy

      - name: Clone and build Kaldi
        run: |
          git clone --depth=1 https://github.com/alphacep/kaldi
          cd kaldi
          git checkout vosk
          cd tools
          mkdir -p python
          ./extras/install_openblas.sh
          cd ../src
          ./configure --mathlib=OPENBLAS --shared --use-cuda=no
          make -j$(sysctl -n hw.ncpu) clean depend
          make -j$(sysctl -n hw.ncpu)
          cd ../

      - name: Clone vosk-api
        run: |
          git clone --depth=1 https://github.com/alphacep/vosk-api.git vosk

      - name: Build libvosk.dylib
        run: |
          source .venv/bin/activate
          mkdir -p vosk/build
          cd vosk/build
          KALDI_ROOT=$GITHUB_WORKSPACE/kaldi cmake \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DKALDI_ROOT=$GITHUB_WORKSPACE/kaldi \
            ..
          make -j$(sysctl -n hw.ncpu)
          mkdir -p ../../build-${{ matrix.arch }}
          cp src/libvosk.dylib ../../build-${{ matrix.arch }}/

      - name: Upload architecture-specific dylib
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-macos-${{ matrix.arch }}
          path: |
            build-${{ matrix.arch }}/libvosk.dylib
            vosk/src/vosk_api.h

  create-universal:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: libvosk-macos-x86_64
          path: x86_64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: libvosk-macos-arm64
          path: arm64

      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo -create -output universal/libvosk.dylib \
            x86_64/libvosk.dylib \
            arm64/libvosk.dylib
          cp x86_64/vosk_api.h universal/

      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-macos-universal
          path: universal/
